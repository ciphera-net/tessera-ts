# publish — releases @ciphera-net/tessera to the public npm registry on a version tag (v*),
# or via manual trigger. Builds the WASM (web + node) from the public ciphera-tessera sibling
# and the TS dist/, then `npm publish`. The wasm-build steps mirror rust.yml/handshake.yml.
#
# Only tag (v*) and manual events carry the npmjs_token secret (push/pull_request do not, and this
# is a public repo with require_approval=forks) — so this is the only trigger set that can ever
# see NODE_AUTH_TOKEN.
#
# OWNER PREREQUISITES:
#   • ciphera-net/tessera is PUBLIC — no auth needed for the sibling clone.
#   • packages/tessera-ts/package.json publishConfig points at registry.npmjs.org (the public npm
#     registry, NOT GitHub Packages) — @ciphera-net/tessera ships as a real public npm package.
#   • Bump packages/tessera-ts/package.json "version" and push a matching tag,
#     e.g. `git tag v0.1.4 && git push origin v0.1.4`.

# Routes this workflow to the in-cluster Kubernetes agent, which advertises
# `!runner=k8s` — a MANDATORY label, so an agent is only eligible when a task
# asks for it. Deleting this line sends the workflow back to the ci-ops Docker
# agent; that is the rollback, and it is one line.
#
# This repo builds no container image, so there is nothing else to convert: no
# buildx plugin, no registry push, no extra_hosts, no repo trust needed.
labels:
  runner: k8s

when:
  - event: tag
    ref: refs/tags/v*
  - event: manual

steps:
  build:
    image: rust:1
    # Resources declared 29-07-2026 — without them the step pod is QoS BestEffort, first
    # evicted under node memory pressure. Estate-wide sweep after two pulse-backend steps
    # were SIGKILLed (exit 137) mid-download, presenting as a test failure (see
    # pulse-backend #147/#148). Sized by step class.
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 2Gi, cpu: 1 }
          limits: { memory: 6Gi }
    commands:
      - D=$(dirname $(pwd))
      - git clone --depth 1 https://github.com/ciphera-net/tessera.git "$D/ciphera-tessera"
      - rustup target add wasm32-unknown-unknown
      # 🔑 PREBUILT, CHECKSUM-PINNED wasm-pack — NOT `cargo install`, which
      # compiled it FROM SOURCE on every run. The official release tarball is the
      # same artifact the crate would have produced, verified by sha256 rather
      # than trusted — the identical pattern used for the Go tarball elsewhere in
      # this repo, and still NOT an unverified curl|sh. Matches verify.yml; keep
      # the version and hash in step if either moves.
      - WP=wasm-pack-v0.15.0-x86_64-unknown-linux-musl
      - WP_SHA256=c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
      - curl -fsSLO "https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/$WP.tar.gz"
      - echo "$WP_SHA256  $WP.tar.gz" | sha256sum -c -
      - tar -xzf "$WP.tar.gz"
      - install -m 0755 "$WP/wasm-pack" /usr/local/cargo/bin/wasm-pack
      - wasm-pack --version
      - bash packages/tessera-ts/scripts/build-wasm.sh

  publish:
    image: node:24
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 1Gi, cpu: 500m }
          limits: { memory: 4Gi }
    environment:
      NODE_AUTH_TOKEN:
        from_secret: npmjs_token
    commands:
      - cd packages/tessera-ts
      # Presence-only check (length, never the value) — fails fast with a clear message instead
      # of a confusing downstream ENEEDAUTH if the secret didn't get injected for this event.
      - test -n "$NODE_AUTH_TOKEN" || (echo "NODE_AUTH_TOKEN is empty — npmjs_token secret not injected for this event" && exit 1)
      # publishConfig.registry (registry.npmjs.org) is the public npm registry — no committed
      # .npmrc in this repo maps it to a token, so write one for this step only.
      # NOTE: deliberately NOT using npm's own brace-variable .npmrc convention (dollar sign,
      # open brace, NODE_AUTH_TOKEN, close brace) here — Woodpecker performs its own brace-variable
      # substitution on the raw commands: strings at pipeline-compile time, scanning even inside
      # comments (only its built-in CI_*/matrix vars are recognized), so that literal would be
      # silently rewritten to an empty string before the shell ever runs, producing a token-less
      # .npmrc and a hard-to-diagnose ENEEDAUTH — with a hard pipeline parse error ("unable to
      # parse variable name") if the string even appears in a comment elsewhere in this file.
      # Using printf's %s with the token as a separate shell-expanded argument (no brace-variable
      # substring anywhere in this YAML) sidesteps Woodpecker's compile-time pass entirely.
      - printf 'registry=https://registry.npmjs.org\n//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
      - npm ci
      - npm audit --omit=dev
      - npm run build:ts
      # Idempotent: publish only if this version isn't already on the registry. Re-tagging after
      # a partial release is safe; any other error still fails the job. The skip-guard matches
      # ONLY the explicit version-conflict signals ("cannot publish over" text, EPUBLISHCONFLICT).
      # Deliberately NOT matching bare 403/E403: registry.npmjs.org uses 403 for auth denials
      # too, and a broad match would silently swallow a real auth failure as "already published".
      # On any other failure, print err.log before re-raising so the real npm error (e.g. auth)
      # is visible in the step log instead of being silently swallowed in the redirected file.
      - |
        npm publish 2>err.log \
          || (grep -qiE "cannot publish over|EPUBLISHCONFLICT" err.log \
              && echo "version already published — skipping" \
              || (cat err.log; exit 1))
